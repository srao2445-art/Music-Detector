<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css"><title>Admin | The Creator Studio</title></head><body><div class="particles"></div><section id="loginBox" class="login card"><h1>Admin Login</h1><p class="muted">Sign in with a Firebase Auth admin email.</p><form id="loginForm" class="form"><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="password" type="password" placeholder="Password" required><button class="btn primary">Login</button></form><p id="status" class="muted"></p></section><section id="dashboard" class="admin-wrap" style="display:none"><aside class="sidebar"><a class="brand" href="index.html"><span class="logo">✦</span><span>The Creator Studio</span></a><button class="tab" data-target="#homePanel">Homepage</button><button class="tab" data-target="#projectsPanel">Projects</button><button class="tab" data-target="#articlesPanel">Articles</button><button class="tab" data-target="#settingsPanel">Settings</button><button id="logout" class="btn">Logout</button><p id="dashStatus" class="muted"></p></aside><main class="admin-main"><div id="homePanel" class="panel active card"><h2>Homepage Content</h2><form id="homeForm" class="form"><input class="input" name="eyebrow" placeholder="Eyebrow"><input class="input" name="headline" placeholder="Headline"><textarea name="intro" placeholder="Intro"></textarea><div class="two"><input class="input" name="primaryCta" placeholder="Primary CTA"><input class="input" name="secondaryCta" placeholder="Secondary CTA"></div><button class="btn primary">Save homepage</button></form></div><div id="projectsPanel" class="panel card"><div class="toolbar"><h2>Projects</h2><button id="newProject" class="btn">New</button></div><form id="projectForm" class="form"><div class="two"><input class="input" name="title" placeholder="Title" required><input class="input" name="category" placeholder="Category"></div><input class="input" name="summary" placeholder="Summary"><input class="input" name="tags" placeholder="Tags, comma separated"><textarea name="content" placeholder="Project content"></textarea><button class="btn primary">Save project</button></form><hr><div id="projectList" class="list"></div></div><div id="articlesPanel" class="panel card"><div class="toolbar"><h2>Articles</h2><button id="newArticle" class="btn">New</button></div><form id="articleForm" class="form"><input class="input" name="title" placeholder="Title" required><input class="input" name="excerpt" placeholder="Excerpt"><textarea name="content" placeholder="Article content"></textarea><label><input type="checkbox" name="published"> Published</label><button class="btn primary">Save article</button></form><hr><div id="articleList" class="list"></div></div><div id="settingsPanel" class="panel card"><h2>Site Settings</h2><form id="settingsForm" class="form"><div class="two"><input class="input" name="logo" placeholder="Logo text"><input class="input" name="title" placeholder="Website title"></div><input class="input" name="seoTitle" placeholder="SEO title"><textarea name="metaDescription" placeholder="Meta description"></textarea><div class="two"><input class="input" name="twitter" placeholder="Twitter/X link"><input class="input" name="instagram" placeholder="Instagram link"><input class="input" name="github" placeholder="GitHub link"><input class="input" name="version" placeholder="Version text"></div><label><input type="checkbox" name="maintenance"> Maintenance mode</label><button class="btn primary">Save settings</button></form></div></main></section><script type="module" src="js/admin.js"></script></body></html>
