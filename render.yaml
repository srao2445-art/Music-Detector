services:
  - type: web
    name: the-creator-studio
    env: node
    buildCommand: npm install && npm run init-db
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: creator-studio-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        value: srao2445@gmail.com
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
databases:
  - name: creator-studio-db
    plan: free
